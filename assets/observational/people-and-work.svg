<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="354" viewBox="0 0 1200 354" role="img" aria-labelledby="title desc">
<title id="title">People, play, language and work — connected questions</title>
<desc id="desc">Bright neon connections between people, early internet, games, conversation, language, and code or tests. No person is placed above, ahead of, or at the origin of the others. The different topics remain distinct.</desc>
<defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090E22"/><stop offset=".7" stop-color="#130C27"/><stop offset="1" stop-color="#071326"/></linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#02EBFA"/><stop offset=".45" stop-color="#E948FA"/><stop offset="1" stop-color="#B9FF61"/></linearGradient>
<pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#49648C" stroke-width=".8" opacity=".25"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>
<rect width="1200" height="354" rx="14" fill="url(#back)"/>
<rect width="1200" height="354" rx="14" fill="url(#grid)"/>
