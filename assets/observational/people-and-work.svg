<text x="42" y="127" fill="#F4F8FF" font-size="41" font-weight="700" letter-spacing="-1">People were</text>
<text x="42" y="174" fill="#F4F8FF" font-size="41" font-weight="700" letter-spacing="-1">already here<tspan fill="#FC4BDF">.</tspan></text>
<text x="44" y="221" fill="#BFCFEA" font-size="19">Exploring, playing, reading, talking.</text>
<text x="44" y="252" fill="#BFCFEA" font-size="19">Then trying to understand what I noticed.</text>
