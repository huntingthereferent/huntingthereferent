<title id="tit">How to read the A/B atlas</title><desc id="desc">Cyan marks an A movement in a defined example; magenta marks a B movement. Dotted gold lines invite comparisons between contexts. A split represents a failed equality within a model. These marks do not assert universal mathematical equivalence between unrelated subjects.</desc>
