 <text x="48" y="142" fill="#F3F8FF" font-size="68" font-weight="750" letter-spacing="-2">JAMES <tspan fill="#00F5FF">MUNEOKA</tspan></text>
 <text x="52" y="188" fill="#D5E3F8" font-size="22">Language <tspan fill="#FC45FF">/</tspan> Mathematics <tspan fill="#FC45FF">/</tspan> Systems</text>
 <text x="52" y="231" fill="#B0C4E5" font-size="16">Questions. Implementations. Evidence.</text>
</g>
