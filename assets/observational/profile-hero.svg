<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">James Muneoka | Independent research and software</title>
<desc id="desc">Minimal dark futuristic banner with electric cyan, neon magenta, ultraviolet and lime abstract data lines. Clear text names James and his areas of research.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090E20"/><stop offset=".62" stop-color="#090B19"/><stop offset="1" stop-color="#160D2A"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#00F5FF"/><stop offset=".32" stop-color="#67FFDC"/><stop offset=".68" stop-color="#FC45FF"/><stop offset="1" stop-color="#AD69FF"/></linearGradient>
 <linearGradient id="light" x2="1" y2="0"><stop stop-color="#00F5FF"/><stop offset="1" stop-color="#BD4CFF"/></linearGradient>
 <filter id="glow" x="-80%" y="-90%" width="260%" height="280%"><feGaussianBlur stdDeviation="8"/></filter>
